name: Deploy site to GitHub Pages

# Publishes the landing page at https://automine.com.br on every push to main.
# One-time setup in the repository: Settings → Pages → Source: "GitHub Actions",
# and Custom domain: automine.com.br (see README → Deploy).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect public files
        # Only the website is published; README, tools/ and dotfiles stay out.
        run: |
          mkdir -p _site
          cp -R index.html 404.html robots.txt sitemap.xml site.webmanifest assets _site/
          find _site -type f | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
